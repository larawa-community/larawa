name: larawa

x-larawa-app-env: &larawa-app-env
  APP_NAME: ${APP_NAME:-LaraWA}
  APP_KEY: ${APP_KEY:-}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  DB_CONNECTION: ${DB_CONNECTION:-sqlite}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-/var/www/html/storage/database/database.sqlite}
  DB_USERNAME: ${DB_USERNAME:-larawa}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:-}
  AWS_URL: ${AWS_URL:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
  WA_WORKER_URL: http://wa-worker:3001
  WA_WORKER_INTERNAL_TOKEN: ${WA_WORKER_INTERNAL_TOKEN:-change-me-worker-token}
  WA_WORKER_CALLBACK_URL: http://nginx/api/internal/worker/events
  LARAWA_ENV_PATH: /var/www/html/storage/app/larawa/.env
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  LARAWA_MEDIA_BASE64_MAX_BYTES: ${LARAWA_MEDIA_BASE64_MAX_BYTES:-26214400}
  WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
  WEBHOOK_RETRY_ATTEMPTS: ${WEBHOOK_RETRY_ATTEMPTS:-3}
  WEBHOOK_RETRY_BACKOFF: ${WEBHOOK_RETRY_BACKOFF:-30,120,300}

services:
  app:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *larawa-app-env
      LARAWA_BOOTSTRAP: "true"
    volumes:
      - larawa_storage:/var/www/html/storage
      - larawa_database:/legacy-database:ro
      - larawa_cache:/var/www/html/bootstrap/cache
      - larawa_public:/var/www/html/public
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "larawa-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - larawa_public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    env_file:
      - path: .env
        required: false
    command: >
      sh -lc 'if [ "$${LARAWA_INSTALLED:-false}" != "true" ]; then
        until [ -s "$${LARAWA_ENV_PATH}" ] && grep -q "^LARAWA_INSTALLED=true" "$${LARAWA_ENV_PATH}"; do sleep 5; done;
        set -a; . "$${LARAWA_ENV_PATH}"; set +a;
      fi;
      exec php artisan queue:work --tries=3 --timeout=90'
    environment:
      <<: *larawa-app-env
      LARAWA_BOOTSTRAP: "false"
    volumes:
      - larawa_storage:/var/www/html/storage
      - larawa_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "larawa-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    env_file:
      - path: .env
        required: false
    command: >
      sh -lc 'if [ "$${LARAWA_INSTALLED:-false}" != "true" ]; then
        until [ -s "$${LARAWA_ENV_PATH}" ] && grep -q "^LARAWA_INSTALLED=true" "$${LARAWA_ENV_PATH}"; do sleep 5; done;
        set -a; . "$${LARAWA_ENV_PATH}"; set +a;
      fi;
      exec php artisan schedule:work'
    environment:
      <<: *larawa-app-env
      LARAWA_BOOTSTRAP: "false"
    volumes:
      - larawa_storage:/var/www/html/storage
      - larawa_cache:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "larawa-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  wa-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      WA_WORKER_PORT: 3001
      WA_WORKER_INTERNAL_TOKEN: ${WA_WORKER_INTERNAL_TOKEN:-change-me-worker-token}
      WA_WORKER_CALLBACK_URL: http://nginx/api/internal/worker/events
      LARAWA_ENV_PATH: /var/www/html/storage/app/larawa/.env
      WA_WORKER_DATA_PATH: /data/sessions
      WA_WORKER_CALLBACK_ATTEMPTS: ${WA_WORKER_CALLBACK_ATTEMPTS:-6}
      WA_WORKER_CALLBACK_RETRY_DELAY_MS: ${WA_WORKER_CALLBACK_RETRY_DELAY_MS:-1500}
      WA_WORKER_SHUTDOWN_TIMEOUT_MS: ${WA_WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      WA_WORKER_JSON_BODY_LIMIT: ${WA_WORKER_JSON_BODY_LIMIT:-50mb}
      WA_WORKER_MEDIA_URL_MAX_BYTES: ${WA_WORKER_MEDIA_URL_MAX_BYTES:-26214400}
      WA_WORKER_MEDIA_BASE64_MAX_BYTES: ${WA_WORKER_MEDIA_BASE64_MAX_BYTES:-26214400}
      WA_WORKER_MEDIA_URL_MAX_REDIRECTS: ${WA_WORKER_MEDIA_URL_MAX_REDIRECTS:-3}
      MEDIA_URL_ALLOW_PRIVATE: ${MEDIA_URL_ALLOW_PRIVATE:-false}
    volumes:
      - larawa_worker_sessions:/data/sessions
      - larawa_storage:/var/www/html/storage:ro
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - larawa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-larawa}
      POSTGRES_USER: ${POSTGRES_USER:-larawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larawa} -d ${POSTGRES_DB:-larawa}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - larawa_postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  larawa_storage:
  larawa_database:
  larawa_cache:
  larawa_public:
  larawa_worker_sessions:
  larawa_redis:
  larawa_postgres:
